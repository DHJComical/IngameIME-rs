[package]
name = "ingameime-core"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# JNI - use 0.21.x for stable API
jni = "0.21.1"
windows-core = "0.58"

# windows
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "implement",
    "Win32_Foundation",
    "Win32_UI_Input_Ime",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_UI_TextServices",
    "Win32_Globalization",
] }
windows-core = "0.58"
