[package]
name = "ingameime-display"
version = "0.1.0"
edition = "2024"
description = "IngameIME display interface"

[dependencies]
# IngameIme
ingameime-core = { path = "../core" }

# logging
log = "0.4.29"
env_logger = "0.11.8"

# Egui
egui = "0.33.3"
egui-winit = "0.33.3"
egui-wgpu = "0.33.3"

# Wgpu
wgpu = "27.0.1"

# Winit
winit = { version = "0.30.12", features = ["rwh_06"] }

# Utilities
pollster = "0.4.0"
font-kit = "0.14.3"
